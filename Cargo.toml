[package]
name = "hyprspanso"
version = "0.10.0"
edition = "2024"
description = "espanso-compatible trigger/replace text expander for Hyprland/Wayland"
license = "MIT"
repository = "https://github.com/letoloke/hyprspanso"
readme = "README.md"
keywords = ["hyprland", "wayland", "espanso", "text-expander", "wayland-compositor"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
evdev = "0.13.2"
libc = "0.2.191"
ratatui = "0.30.2"
serde = "1.0.229"
serde_json = "1.0.154"
serde_yaml = "0.9.34"
unicode-segmentation = "1.13.3"
xkbcommon = "0.9.0"
